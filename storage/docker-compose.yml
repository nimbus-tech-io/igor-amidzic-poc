services:
  localstack:
    image: localstack/localstack:latest
    container_name: localstack
    ports:
      - "4566:4566"     
      - "4510-4559:4510-4559"
    environment:
      - SERVICES=s3,sqs     
      - DEBUG=1
      - AWS_DEFAULT_REGION=eu-central-1
      - HOSTNAME_EXTERNAL=localhost
    volumes:
      - "./.localstack:/var/lib/localstack" 
      - "/var/run/docker.sock:/var/run/docker.sock"
